[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "event-scheduler-cp"
version = "0.1.0"
description = "Offline-first CP-SAT event scheduling experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "ortools>=9.10,<10",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
calendar = [
  "google-api-python-client>=2.120,<3",
  "google-auth-httplib2>=0.2,<1",
  "google-auth-oauthlib>=1.2,<2",
]
dev = ["pytest>=8,<9"]

[project.scripts]
event-scheduler = "event_scheduler.cli:main"

[tool.setuptools.packages.find]
include = ["event_scheduler*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
